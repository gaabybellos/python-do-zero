[project]
name = "python-do-zero"
version = "1.0.0"
description = "Ambiente Open Source de aprendizado de Lógica de Programação, Python do Zero, Clean Code e Qualidade de Software (QA-First) guiado por Agentes de IA"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = [
    "modulos",
    "faculdade",
]
pythonpath = [
    ".",
    "faculdade/04-calculadora-folha-pagamento/03-entrega-professor",
]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
