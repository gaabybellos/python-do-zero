[project]
name = "python-do-zero"
version = "0.1.0"
description = "Ambiente Open Source de aprendizado de Lógica de Programação, Python do Zero, Clean Code e Qualidade de Software (QA-First) guiado por Agentes de IA"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "modulos",
    "estudos-de-caso",
]
pythonpath = [
    ".",
    "scripts",
    "estudos-de-caso/01-sistema-boletim-academico/04-solucao-referencia",
    "estudos-de-caso/02-analisador-consumo-energia/04-solucao-referencia",
    "estudos-de-caso/03-controle-estoque-farmacia/04-solucao-referencia",
    "estudos-de-caso/04-calculadora-folha-pagamento/04-solucao-referencia",
]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
